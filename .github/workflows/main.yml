name: Build KalipheTiles
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name KalipheTiles --hidden-import shapefile --add-data "static;static" launcher.py
      - uses: actions/upload-artifact@v4
        with: { name: KalipheTiles-windows, path: dist/KalipheTiles.exe }
